<!DOCTYPE html>
<!--
  GitHub Pages doesn't understand client-side routes like /menu or /about —
  it just looks for a real folder/file at that path and 404s if it's not there.
  This page catches that 404, stashes the intended path, and bounces to
  index.html, which then reads it back and restores the correct route.
  This is a well-known workaround for single-page apps on GitHub Pages.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>doffee.</title>
    <script>
      var pathSegmentsToKeep = 1; // keeps "/Doffee" as the base
      var l = window.location;
      l.replace(
        l.protocol + "//" + l.hostname + (l.port ? ":" + l.port : "") +
        l.pathname.split("/").slice(0, 1 + pathSegmentsToKeep).join("/") +
        "/?/" +
        l.pathname.slice(1).split("/").slice(pathSegmentsToKeep).join("/").replace(/&/g, "~and~") +
        (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
